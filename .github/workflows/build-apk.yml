name: Build & Release APK

# Compile l'APK ONYX TV et le publie dans une Release GitHub à une URL FIXE :
#   https://github.com/rosajayz14-boop/onyx/releases/download/tv-latest/onyx-tv.apk
# Cette URL ne change jamais : elle pointe toujours vers la dernière version publiée,
# ce qui est idéal pour un code Downloader (aftv.news) créé une seule fois.

on:
  push:
    branches: ["**"]
    paths-ignore:
      - "**/*.md"
      - "docs/**"
  workflow_dispatch: {}

permissions:
  contents: write

concurrency:
  group: build-apk
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      - name: Set up Android SDK
        uses: android-actions/setup-android@v3

      - name: Install SDK packages
        run: |
          yes | sdkmanager --licenses >/dev/null || true
          sdkmanager "platform-tools" "platforms;android-35" "build-tools;35.0.0"

      - name: Grant execute permission for gradlew
        run: chmod +x ./gradlew

      # Clé de signature OPTIONNELLE. Pour une signature stable (mises à jour sans
      # désinstaller), ajoutez dans Settings → Secrets → Actions :
      #   ONYX_KEYSTORE_BASE64 = base64 de votre .jks
      #   ONYX_STORE_PW, ONYX_KEY_ALIAS, ONYX_KEY_PW
      # Sans ces secrets, l'APK est signé avec la clé de debug (installe quand même).
      - name: Decode signing keystore (optional)
        id: signing
        env:
          KS_B64: ${{ secrets.ONYX_KEYSTORE_BASE64 }}
        run: |
          if [ -n "$KS_B64" ]; then
            echo "$KS_B64" | base64 -d > "$RUNNER_TEMP/onyx-release.jks"
            echo "ONYX_STORE_FILE=$RUNNER_TEMP/onyx-release.jks" >> "$GITHUB_ENV"
            echo "signed=release" >> "$GITHUB_OUTPUT"
            echo "Clé de release détectée : signature stable."
          else
            echo "signed=debug" >> "$GITHUB_OUTPUT"
            echo "Aucune clé de release : signature debug (fonctionne pour le sideload)."
          fi

      - name: Build release APK
        env:
          ONYX_STORE_PW: ${{ secrets.ONYX_STORE_PW }}
          ONYX_KEY_ALIAS: ${{ secrets.ONYX_KEY_ALIAS }}
          ONYX_KEY_PW: ${{ secrets.ONYX_KEY_PW }}
        run: ./gradlew :app:assembleRelease --no-daemon --stacktrace

      - name: Prepare APK
        id: apk
        run: |
          SRC=app/build/outputs/apk/release/app-release.apk
          if [ ! -f "$SRC" ]; then
            echo "APK introuvable à $SRC" >&2
            find app/build/outputs -name '*.apk' -print || true
            exit 1
          fi
          mkdir -p dist
          cp "$SRC" dist/onyx-tv.apk
          echo "size=$(du -h dist/onyx-tv.apk | cut -f1)" >> "$GITHUB_OUTPUT"
          ls -la dist/

      - name: Upload build artifact
        uses: actions/upload-artifact@v4
        with:
          name: onyx-tv-apk
          path: dist/onyx-tv.apk
          if-no-files-found: error

      - name: Publish rolling release (tv-latest)
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release delete tv-latest --yes --cleanup-tag 2>/dev/null || true
          gh release create tv-latest dist/onyx-tv.apk \
            --title "ONYX TV — dernière version" \
            --notes "APK pour Android TV / Fire TV / Google TV.

          **Installation via Downloader** : ouvrez l'app Downloader sur votre téléviseur et saisissez l'URL :
          \`https://github.com/${{ github.repository }}/releases/download/tv-latest/onyx-tv.apk\`

          Build automatique — commit ${{ github.sha }}." \
            --latest
