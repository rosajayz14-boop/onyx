name: Build & Release APK

# Compile l'APK ONYX TV et le publie dans des Releases GitHub :
#  - "tv-latest"  : URL FIXE qui pointe toujours vers la dernière version (idéal Downloader).
#      https://github.com/rosajayz14-boop/onyx/releases/download/tv-latest/onyx-tv.apk
#  - "vX.Y.Z"     : Release VERSIONNÉE, créée quand on pousse un tag Git "v*".
#      https://github.com/rosajayz14-boop/onyx/releases/download/vX.Y.Z/onyx-tv-X.Y.Z.apk
#
# Cadencer une version :   git tag v1.0.0 && git push origin v1.0.0

on:
  push:
    branches: ["**"]
    tags: ["v*"]
    paths-ignore:
      - "**/*.md"
      - "docs/**"
  workflow_dispatch: {}

permissions:
  contents: write

concurrency:
  group: build-apk-${{ github.ref }}
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      # Le runner ubuntu-latest fournit déjà le SDK Android (ANDROID_HOME). On installe
      # juste la plateforme et les build-tools requis par compileSdk = 35, sans utiliser
      # android-actions/setup-android (qui tente d'installer le paquet obsolète "tools").
      - name: Install Android SDK packages
        run: |
          SDKMGR="$(find "$ANDROID_HOME/cmdline-tools" -type f -name sdkmanager -path '*/bin/*' | sort | tail -1)"
          echo "Using: $SDKMGR"
          yes | "$SDKMGR" --licenses >/dev/null 2>&1 || true
          "$SDKMGR" "platform-tools" "platforms;android-35" "build-tools;35.0.0"

      - name: Grant execute permission for gradlew
        run: chmod +x ./gradlew

      # Détermine la version. Sur un tag "vX.Y.Z" => versionName = X.Y.Z et Release versionnée.
      # Sinon => build de développement (versionName par défaut), publié seulement dans tv-latest.
      # versionCode = numéro de run (toujours croissant) pour que les mises à jour s'installent.
      - name: Determine version
        id: ver
        run: |
          if [ "${{ github.ref_type }}" = "tag" ]; then
            VN="${GITHUB_REF_NAME#v}"
            echo "is_tag=true"  >> "$GITHUB_OUTPUT"
            echo "tag=${GITHUB_REF_NAME}" >> "$GITHUB_OUTPUT"
          else
            VN="0.1.0"
            echo "is_tag=false" >> "$GITHUB_OUTPUT"
          fi
          echo "version_name=$VN" >> "$GITHUB_OUTPUT"
          echo "ONYX_VERSION_NAME=$VN" >> "$GITHUB_ENV"
          echo "ONYX_VERSION_CODE=${{ github.run_number }}" >> "$GITHUB_ENV"
          echo "Version: $VN (code ${{ github.run_number }})"

      # Clé de signature OPTIONNELLE. Pour une signature stable (mises à jour sans
      # désinstaller), ajoutez dans Settings → Secrets → Actions :
      #   ONYX_KEYSTORE_BASE64 = base64 de votre .jks
      #   ONYX_STORE_PW, ONYX_KEY_ALIAS, ONYX_KEY_PW
      # Sans ces secrets, l'APK est signé avec la clé de debug (installe quand même).
      - name: Decode signing keystore (optional)
        id: signing
        env:
          KS_B64: ${{ secrets.ONYX_KEYSTORE_BASE64 }}
        run: |
          if [ -n "$KS_B64" ]; then
            echo "$KS_B64" | base64 -d > "$RUNNER_TEMP/onyx-release.jks"
            echo "ONYX_STORE_FILE=$RUNNER_TEMP/onyx-release.jks" >> "$GITHUB_ENV"
            echo "signed=release" >> "$GITHUB_OUTPUT"
            echo "Clé de release détectée : signature stable."
          else
            echo "signed=debug" >> "$GITHUB_OUTPUT"
            echo "Aucune clé de release : signature debug (fonctionne pour le sideload)."
          fi

      - name: Build release APK
        env:
          ONYX_STORE_PW: ${{ secrets.ONYX_STORE_PW }}
          ONYX_KEY_ALIAS: ${{ secrets.ONYX_KEY_ALIAS }}
          ONYX_KEY_PW: ${{ secrets.ONYX_KEY_PW }}
        run: ./gradlew :app:assembleRelease --no-daemon --stacktrace

      - name: Prepare APK
        id: apk
        run: |
          SRC=app/build/outputs/apk/release/app-release.apk
          if [ ! -f "$SRC" ]; then
            echo "APK introuvable à $SRC" >&2
            find app/build/outputs -name '*.apk' -print || true
            exit 1
          fi
          mkdir -p dist
          cp "$SRC" dist/onyx-tv.apk
          cp "$SRC" "dist/onyx-tv-${{ steps.ver.outputs.version_name }}.apk"
          echo "size=$(du -h dist/onyx-tv.apk | cut -f1)" >> "$GITHUB_OUTPUT"
          ls -la dist/

      - name: Upload build artifact
        uses: actions/upload-artifact@v4
        with:
          name: onyx-tv-${{ steps.ver.outputs.version_name }}
          path: dist/onyx-tv*.apk
          if-no-files-found: error

      # Release "roulante" tv-latest : URL fixe, toujours la dernière version (pour Downloader).
      - name: Publish rolling release (tv-latest)
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release delete tv-latest --yes --cleanup-tag 2>/dev/null || true
          gh release create tv-latest dist/onyx-tv.apk \
            --title "ONYX TV — dernière version (${{ steps.ver.outputs.version_name }})" \
            --notes "APK pour Android TV / Fire TV / Google TV — version ${{ steps.ver.outputs.version_name }}.

          **Installation via Downloader** — URL fixe (ne change jamais) :
          \`https://github.com/${{ github.repository }}/releases/download/tv-latest/onyx-tv.apk\`

          Build automatique — commit ${{ github.sha }}." \
            --latest

      # Release VERSIONNÉE : uniquement quand on pousse un tag "vX.Y.Z".
      - name: Publish versioned release
        if: steps.ver.outputs.is_tag == 'true'
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release create "${{ steps.ver.outputs.tag }}" \
            "dist/onyx-tv-${{ steps.ver.outputs.version_name }}.apk" \
            --title "ONYX TV ${{ steps.ver.outputs.version_name }}" \
            --notes "Version ${{ steps.ver.outputs.version_name }} — Android TV / Fire TV / Google TV.

          **URL directe de cette version :**
          \`https://github.com/${{ github.repository }}/releases/download/${{ steps.ver.outputs.tag }}/onyx-tv-${{ steps.ver.outputs.version_name }}.apk\`

          Pour toujours la dernière version, utilisez plutôt l'URL fixe \`tv-latest\`."
